[project]
name = "femtech-api"
version = "0.1.0"
description = "Reproductive health and pregnancy tracker API"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<6.1",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.4",
    "drf-spectacular>=0.28",
    "django-cors-headers>=4.6",
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "python-dotenv>=1.0",
    "gunicorn>=23.0",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "django-stubs>=5.1",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
addopts = "--strict-markers"
markers = [
    "e2e: boots the real ASGI server in a subprocess and drives it over HTTP (tests/e2e/)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Migrations follow Django's generated single-line-per-field style.
"**/migrations/*.py" = ["E501"]
