<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · {{ operator_name }}</title>
  <style>
    :root { --bg: #fcf8f5; --ink: #2d2d2d; --muted: #6b6b6b; --accent: #b83253; --line: #ece4df; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d1a1c; --ink: #f4eef0; --muted: #b9adb3; --accent: #f08aa3; --line: #3a3438; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
    h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 4px; }
    h2 { font-size: 1.2rem; margin: 32px 0 8px; }
    .meta { color: var(--muted); margin: 0 0 24px; }
    a { color: var(--accent); }
    ul { padding-left: 20px; }
    li { margin: 4px 0; }
    nav { border-top: 1px solid var(--line); margin-top: 40px; padding-top: 16px; font-size: .95rem; }
    nav a { margin-right: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>{% block heading %}{% endblock %}</h1>
    <p class="meta">{{ operator_name }}{% if effective_date %} · Effective {{ effective_date }}{% endif %}</p>
    {% block content %}{% endblock %}
    <nav>
      <a href="{% url 'legal-privacy' %}">Privacy policy</a>
      <a href="{% url 'legal-terms' %}">Terms</a>
      <a href="{% url 'legal-account-deletion' %}">Delete your account</a>
      <a href="mailto:{{ support_email }}">{{ support_email }}</a>
    </nav>
  </main>
</body>
</html>
