<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Happy Women{% endblock %}</title>
  <style>
    :root { --bg: #fcf8f5; --card: #ffffff; --ink: #2d2d2d; --muted: #6b6b6b; --accent: #b83253; --error: #a4262c; --line: #ece4df; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d1a1c; --card: #29252a; --ink: #f4eef0; --muted: #b9adb3; --accent: #f08aa3; --error: #ff9a9f; --line: #3a3438; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; line-height: 1.25; }
    p { margin: 0 0 16px; color: var(--muted); }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font: inherit; background: var(--bg); color: var(--ink); }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font: 600 1rem/1 inherit; cursor: pointer; }
    .errors { margin: 6px 0 0; padding: 0; list-style: none; color: var(--error); font-size: .9rem; }
    .help { font-size: .85rem; color: var(--muted); }
    .help ul { margin: 6px 0 0; padding-left: 18px; }
  </style>
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
