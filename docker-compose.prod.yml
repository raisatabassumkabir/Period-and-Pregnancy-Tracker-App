# Shared by api and celery-worker so the two can never drift apart (the
# RevenueCat keys once reached neither container for exactly that reason).
x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS must be set}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  DATABASE_URL: postgres://${APP_DB_USER:-femtech}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-femtech}
  REDIS_URL: redis://redis:6379/0
  DOMAIN: ${DOMAIN:?DOMAIN must be set}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Traefik is the only proxy in front of the API; it appends the client IP.
  DRF_NUM_PROXIES: ${DRF_NUM_PROXIES:-1}
  ADMIN_URL: ${ADMIN_URL:?ADMIN_URL must be set to a non-guessable path ending in /}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
  JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
  # Password-reset email (Resend via django-anymail). The worker sends it.
  RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY must be set}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL must be set, e.g. Happy Women <no-reply@yourdomain.com>}
  # Shown on /legal/privacy/, /legal/terms/ and /legal/account-deletion/.
  LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:?LEGAL_OPERATOR_NAME must be set (who runs the app)}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:?SUPPORT_EMAIL must be set}
  LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:-}
  # The privacy policy quotes this; keep it equal to the db-backup retention.
  BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
  # Optional while v1 ships free; the webhook answers 401 until they are set.
  REVENUECAT_SECRET_API_KEY: ${REVENUECAT_SECRET_API_KEY:-}
  REVENUECAT_WEBHOOK_AUTHORIZATION: ${REVENUECAT_WEBHOOK_AUTHORIZATION:-}
  REVENUECAT_REQUEST_TIMEOUT_SECONDS: ${REVENUECAT_REQUEST_TIMEOUT_SECONDS:-5}

services:
  # -------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension & RLS security role setup
  # -------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-femtech}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      APP_DB_USER: ${APP_DB_USER:-femtech}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
    volumes:
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ${POSTGRES_DB:-femtech}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal_network

  # -------------------------------------------------------------------------
  # Redis 7 for cache, rate limiting, and Celery message broker
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  # -------------------------------------------------------------------------
  # Django API (Gunicorn, threaded WSGI workers)
  # -------------------------------------------------------------------------
  # No `ports:` on purpose. Traefik reaches the container over dokploy-network
  # and terminates TLS; a published port would serve plain HTTP on the public
  # IP, and Docker-published ports bypass ufw.
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: web
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *django-env
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    healthcheck:
      # Host header must be in ALLOWED_HOSTS or Django answers 400.
      test:
        [
          'CMD-SHELL',
          'curl -fsS -H "Host: $${DOMAIN}" http://localhost:8000/health/ || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - internal_network
      - dokploy-network
    # Routing lives here (versioned with the stack), not in Dokploy's Domains UI.
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=dokploy-network'
      - 'traefik.http.routers.femtech-api.rule=Host(`${DOMAIN:-localhost}`)'
      - 'traefik.http.routers.femtech-api.entrypoints=websecure'
      - 'traefik.http.routers.femtech-api.tls.certresolver=letsencrypt'
      - 'traefik.http.services.femtech-api.loadbalancer.server.port=8000'
      # Plain HTTP on :80 only ever redirects; Django never sees it.
      - 'traefik.http.middlewares.femtech-api-https.redirectscheme.scheme=https'
      - 'traefik.http.middlewares.femtech-api-https.redirectscheme.permanent=true'
      - 'traefik.http.routers.femtech-api-http.rule=Host(`${DOMAIN:-localhost}`)'
      - 'traefik.http.routers.femtech-api-http.entrypoints=web'
      - 'traefik.http.routers.femtech-api-http.middlewares=femtech-api-https'

  # -------------------------------------------------------------------------
  # Celery worker (RevenueCat webhook reconciliation, password-reset emails)
  # -------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *django-env
      CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-info}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'celery -A config inspect ping -d celery@$${HOSTNAME} --timeout 10 || exit 1',
        ]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    networks:
      - internal_network

  # -------------------------------------------------------------------------
  # Nightly encrypted pg_dump to Cloudflare R2 (see infra/backup/backup.sh and
  # the restore runbook in DEPLOYMENT.md). Only the age PUBLIC key is here.
  # -------------------------------------------------------------------------
  db-backup:
    build:
      context: ./infra/backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-femtech}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT must be set to the age public key}
      BACKUP_BUCKET: ${BACKUP_BUCKET:?BACKUP_BUCKET must be set}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-postgres}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      RCLONE_CONFIG_BACKUP_TYPE: s3
      RCLONE_CONFIG_BACKUP_PROVIDER: Cloudflare
      RCLONE_CONFIG_BACKUP_ENDPOINT: ${BACKUP_S3_ENDPOINT:?BACKUP_S3_ENDPOINT must be set}
      RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?BACKUP_S3_ACCESS_KEY_ID must be set}
      RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?BACKUP_S3_SECRET_ACCESS_KEY must be set}
      # Bucket-scoped R2 tokens cannot list or create buckets.
      RCLONE_CONFIG_BACKUP_NO_CHECK_BUCKET: 'true'
    networks:
      - internal_network

volumes:
  pgdata:
  redisdata:

networks:
  internal_network:
    driver: bridge
  dokploy-network:
    external: true
    name: dokploy-network
