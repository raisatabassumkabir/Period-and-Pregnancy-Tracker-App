services:
  # -------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension & RLS security role setup
  # -------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-femtech}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      APP_DB_USER: ${APP_DB_USER:-femtech}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
    volumes:
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-femtech}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal_network

  # -------------------------------------------------------------------------
  # Redis 7 for cache, rate limiting, and Celery message broker
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  # -------------------------------------------------------------------------
  # Django API Web Application (Gunicorn + Uvicorn ASGI workers)
  # -------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: web
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DATABASE_URL: postgres://${APP_DB_USER:-femtech}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-femtech}
      REDIS_URL: redis://redis:6379/0
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/schema/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - internal_network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.femtech-api.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.femtech-api.entrypoints=websecure"
      - "traefik.http.routers.femtech-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.femtech-api.loadbalancer.server.port=8000"

  # -------------------------------------------------------------------------
  # Celery Asynchronous Worker (AI Assistant, predictions, notifications)
  # -------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DATABASE_URL: postgres://${APP_DB_USER:-femtech}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-femtech}
      REDIS_URL: redis://redis:6379/0
      CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-info}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
    networks:
      - internal_network

  # -------------------------------------------------------------------------
  # Celery Beat Periodic Scheduler (Cycle predictions, daily reminders)
  # -------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DATABASE_URL: postgres://${APP_DB_USER:-femtech}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-femtech}
      REDIS_URL: redis://redis:6379/0
      CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-info}
    networks:
      - internal_network

volumes:
  pgdata:
  redisdata:

networks:
  internal_network:
    driver: bridge
  dokploy-network:
    external: true
    name: dokploy-network
